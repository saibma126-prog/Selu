<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selu World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#09090b;--bg2:#121215;--line:#25252b;--tx:#f3efe8;--mute:#9a968d;--gold:#d4af6a;--gold2:#f1d9a0;--r:18px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:400 16px/1.6 Inter,system-ui,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:300;letter-spacing:-.02em;line-height:1.1}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:14px max(20px,5vw);padding-top:calc(14px + env(safe-area-inset-top));background:rgba(9,9,11,.75);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.logo{font:italic 300 26px Fraunces,serif;color:var(--gold2);margin-right:auto}
nav a.l{padding:8px 14px;border-radius:99px;color:var(--mute);font-size:14px;font-weight:500;transition:.25s}
nav a.l:hover,nav a.l.on{color:var(--tx);background:var(--bg2)}
.btn{border:1px solid var(--line);background:var(--bg2);padding:9px 18px;border-radius:99px;font-size:14px;font-weight:500;transition:.25s}
.btn:hover{border-color:var(--gold)}
.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405;border:0}
.danger:hover{border-color:#e5484d;color:#e5484d}
main{max-width:1100px;margin:0 auto;padding:40px max(20px,4vw) 90px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:center;padding:30px 0 50px}
.ring{width:240px;height:240px;border-radius:50%;padding:4px;background:conic-gradient(from 200deg,var(--gold),#6b4e1b,var(--gold2),var(--gold));animation:spin 14s linear infinite}
.ring>div{width:100%;height:100%;border-radius:50%;background:var(--bg) center/cover;border:5px solid var(--bg);animation:spin 14s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h1{font-size:clamp(46px,8vw,88px);margin-bottom:16px;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero p{color:var(--mute);max-width:52ch;font-size:18px;white-space:pre-line;animation:rise .9s .15s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
h2{font-size:clamp(30px,5vw,46px);margin-bottom:22px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.bar h2{margin:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.masonry{columns:3 230px;column-gap:14px}
.tile{position:relative;margin-bottom:14px;border-radius:var(--r);overflow:hidden;background:var(--bg2);break-inside:avoid;cursor:zoom-in}
.tile img,.tile video{width:100%;display:block;transition:transform .6s}
.tile:hover img{transform:scale(1.04)}
.tile .x{position:absolute;top:10px;right:10px}
.tag{position:absolute;left:10px;bottom:10px;font-size:12px;background:rgba(0,0,0,.6);padding:2px 10px;border-radius:99px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.card .ph{aspect-ratio:1;background:#1a1a1f center/cover}
.card video{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#000}
.card h3{padding:14px 16px;font-size:22px}
.card .x{position:absolute;top:10px;right:10px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.mini div{aspect-ratio:1;border-radius:14px;background:var(--bg2) center/cover}
.det{display:grid;gap:0;max-width:700px}
.det div{display:flex;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}
.det span{color:var(--mute)}
.empty{color:var(--mute);padding:40px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.back{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:28px;width:min(440px,100%);max-height:90vh;overflow:auto;animation:rise .35s}
.modal h3{font-size:28px;margin-bottom:18px}
.modal label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
.modal input,.modal textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 14px;font:inherit}
.modal textarea{min-height:100px;resize:vertical}
.row{display:flex;gap:10px;margin-top:22px;justify-content:flex-end}
.lb{max-width:min(1100px,100%);max-height:88vh;border-radius:14px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--tx);color:#111;padding:10px 20px;border-radius:99px;z-index:60;font-size:14px;animation:rise .3s}
.hide{display:none!important}
@media(max-width:720px){.hero{grid-template-columns:1fr;text-align:center;justify-items:center}.ring{width:180px;height:180px}.mini{grid-template-columns:repeat(2,1fr)}nav a.l{padding:8px 9px;font-size:13px}.logo{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav>
  <a class="logo" href="#/">Selu World</a>
  <a class="l" href="#/">Home</a><a class="l" href="#/friends">Friends</a><a class="l" href="#/gallery">Gallery</a><a class="l" href="#/about">About</a>
  <button class="btn" id="auth">Admin</button>
</nav>
<main id="app"></main>

<script>
/* ============================================================
   >>> PASTE YOUR KEYS HERE (the only place you need to edit) <<<
   ============================================================ */
const CONFIG = {
  SUPABASE_URL:  "https://clzgejqggmnujhgkxfss.supabase.co",        // e.g. https://abcd1234.supabase.co
  SUPABASE_KEY:  "sb_publishable_NOJ-qPCUwS3qPFtRWqo7cQ_AwknnuWe",   // Project Settings > API > anon public key
  CLOUD_NAME:    "pfyrqr7j",    // Cloudinary dashboard
  UPLOAD_PRESET: "selu"    // Settings > Upload > Upload presets (Unsigned)
};
/* ============================================================ */

const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
const S = { user:null, profile:null, friends:[], gallery:[] };
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const admin = () => !!S.user;

// Cloudinary: auto format/quality for speed
const opt = (u, w = 800) => u && u.includes("/upload/") && !u.match(/\.(mp4|mov|webm)$/i) ? u.replace("/upload/", `/upload/f_auto,q_auto,w_${w}/`) : u;
const vopt = u => u && u.includes("/upload/") ? u.replace("/upload/", "/upload/q_auto/") : u;

function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}

async function upload(file){
  const f = new FormData(); f.append("file", file); f.append("upload_preset", CONFIG.UPLOAD_PRESET);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CONFIG.CLOUD_NAME}/auto/upload`, {method:"POST", body:f});
  const d = await r.json();
  if(!r.ok) throw new Error(d.error?.message || "Upload failed");
  return { url:d.secure_url, type:d.resource_type === "video" ? "video" : "image" };
}

async function load(){
  const [u,f,g] = await Promise.all([
    sb.from("users").select("*").limit(1),
    sb.from("friends").select("*").order("name"),
    sb.from("gallery").select("*").order("uploaded_at",{ascending:false})
  ]);
  S.profile = u.data?.[0] || null; S.friends = f.data || []; S.gallery = g.data || [];
  render();
}

/* ---------- Views ---------- */
const views = {
  "/": () => {
    const p = S.profile;
    return `<section class="hero">
      <div class="ring"><div style="background-image:url('${esc(opt(p?.photo,600))}')"></div></div>
      <div><h1>${esc(p?.name || "Selu World")}</h1><p>${esc(p?.bio || "Welcome. This space is being set up.")}</p>
      ${admin() ? `<button class="btn gold" style="margin-top:22px" data-act="profile">Edit profile</button>` : ""}</div></section>
      ${S.gallery.length ? `<div class="bar"><h2>Latest moments</h2><a class="btn" href="#/gallery">See all</a></div>
      <div class="mini">${S.gallery.filter(g=>g.file_type==="image").slice(0,4).map(g=>`<div style="background-image:url('${esc(opt(g.file_url,400))}')"></div>`).join("")}</div>` : ""}`;
  },
  "/friends": () => `<div class="bar"><h2>Friends</h2>${admin()?`<button class="btn gold" data-act="addfriend">Add friend</button>`:""}</div>
    ${S.friends.length ? `<div class="grid">${S.friends.map(f=>`<div class="card">
      ${f.video ? `<video src="${esc(vopt(f.video))}" controls preload="none" playsinline poster="${esc(f.photo?opt(f.photo,500):"")}"></video>` : `<div class="ph" style="background-image:url('${esc(opt(f.photo,500))}')"></div>`}
      <h3>${esc(f.name)}</h3>${admin()?`<button class="btn danger x" data-act="delfriend" data-id="${f.id}">Delete</button>`:""}</div>`).join("")}</div>`
      : `<div class="empty">No friends added yet.</div>`}`,
  "/gallery": () => `<div class="bar"><h2>Gallery</h2>${admin()?`<label class="btn gold">Upload photos & videos<input id="files" type="file" accept="image/*,video/*" multiple hidden></label>`:""}</div>
    ${S.gallery.length ? `<div class="masonry">${S.gallery.map(g=>`<div class="tile" data-act="open" data-id="${g.id}">
      ${g.file_type==="video" ? `<video src="${esc(vopt(g.file_url))}#t=0.1" muted playsinline preload="metadata"></video><span class="tag">Video</span>` : `<img loading="lazy" src="${esc(opt(g.file_url))}" alt="">`}
      ${admin()?`<button class="btn danger x" data-act="delmedia" data-id="${g.id}">Delete</button>`:""}</div>`).join("")}</div>`
      : `<div class="empty">${admin()?"Upload your first photo or video.":"Nothing here yet."}</div>`}`,
  "/about": () => {
    const rows = (S.profile?.details || "").split("\n").map(l=>l.split(/:(.+)/)).filter(a=>a[1]);
    return `<div class="bar"><h2>About</h2>${admin()?`<button class="btn gold" data-act="profile">Edit details</button>`:""}</div>
    ${rows.length ? `<div class="det">${rows.map(([k,v])=>`<div><span>${esc(k.trim())}</span><b style="font-weight:500;text-align:right">${esc(v.trim())}</b></div>`).join("")}</div>` : `<div class="empty">No details yet.</div>`}`;
  }
};

function render(){
  const route = (location.hash.slice(1) || "/");
  $("#app").innerHTML = (views[route] || views["/"])();
  document.querySelectorAll("nav a.l").forEach(a => a.classList.toggle("on", a.getAttribute("href").slice(1) === route));
  $("#auth").textContent = admin() ? "Log out" : "Admin";
  const fi = $("#files"); if(fi) fi.onchange = uploadFiles;
}

/* ---------- Modals ---------- */
function modal(html){
  const b = document.createElement("div"); b.className = "back";
  b.innerHTML = `<div class="modal">${html}</div>`;
  b.onclick = e => { if(e.target === b || e.target.dataset.close !== undefined) b.remove() };
  document.body.append(b); return b;
}
function busy(btn, on){ btn.disabled = on; btn.textContent = on ? "Working…" : btn.dataset.t; }

function loginModal(){
  const m = modal(`<h3>Admin login</h3><form id="lf"><label>Email</label><input name="e" type="email" required autocomplete="username">
    <label>Password</label><input name="p" type="password" required autocomplete="current-password">
    <div class="row"><button type="button" class="btn" data-close>Cancel</button><button class="btn gold" data-t="Log in">Log in</button></div></form>`);
  m.querySelector("form").onsubmit = async e => {
    e.preventDefault(); const f = e.target, b = f.querySelector(".gold"); b.dataset.t = "Log in"; busy(b,true);
    const { error } = await sb.auth.signInWithPassword({ email:f.e.value, password:f.p.value });
    busy(b,false);
    if(error) return toast(error.message);
    m.remove(); toast("Welcome back");
  };
}

function profileModal(){
  const p = S.profile || {};
  const m = modal(`<h3>Edit profile</h3><form id="pf"><label>Name</label><input name="name" required value="${esc(p.name)}">
    <label>Bio</label><textarea name="bio">${esc(p.bio)}</textarea>
    <label>Details (one per line, like “Location: Chennai”)</label><textarea name="details">${esc(p.details)}</textarea>
    <label>Photo</label><input name="photo" type="file" accept="image/*">
    <div class="row"><button type="button" class="btn" data-close>Cancel</button><button class="btn gold" data-t="Save">Save</button></div></form>`);
  m.querySelector("form").onsubmit = async e => {
    e.preventDefault(); const f = e.target, b = f.querySelector(".gold"); b.dataset.t = "Save"; busy(b,true);
    try{
      const row = { name:f.name.value, bio:f.bio.value, details:f.details.value };
      if(f.photo.files[0]) row.photo = (await upload(f.photo.files[0])).url;
      const q = p.id ? sb.from("users").update(row).eq("id",p.id) : sb.from("users").insert(row);
      const { error } = await q; if(error) throw error;
      m.remove(); toast("Profile saved");
    }catch(err){ toast(err.message); busy(b,false); }
  };
}

function friendModal(){
  const m = modal(`<h3>Add friend</h3><form><label>Name</label><input name="name" required>
    <label>Photo</label><input name="photo" type="file" accept="image/*"><label>Video (optional)</label><input name="video" type="file" accept="video/*">
    <div class="row"><button type="button" class="btn" data-close>Cancel</button><button class="btn gold" data-t="Add friend">Add friend</button></div></form>`);
  m.querySelector("form").onsubmit = async e => {
    e.preventDefault(); const f = e.target, b = f.querySelector(".gold"); b.dataset.t = "Add friend"; busy(b,true);
    try{
      const row = { name:f.name.value };
      if(f.photo.files[0]) row.photo = (await upload(f.photo.files[0])).url;
      if(f.video.files[0]) row.video = (await upload(f.video.files[0])).url;
      const { error } = await sb.from("friends").insert(row); if(error) throw error;
      m.remove(); toast("Friend added");
    }catch(err){ toast(err.message); busy(b,false); }
  };
}

async function uploadFiles(e){
  const files = [...e.target.files]; let n = 0;
  for(const file of files){
    toast(`Uploading ${++n} of ${files.length}…`);
    try{
      const { url, type } = await upload(file);
      const { error } = await sb.from("gallery").insert({ file_url:url, file_type:type }); if(error) throw error;
    }catch(err){ toast(err.message); }
  }
  toast("Upload complete");
}

/* ---------- Events ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const { act, id } = el.dataset;
  if(act === "profile") return profileModal();
  if(act === "addfriend") return friendModal();
  if(act === "open"){
    if(e.target.closest("[data-act=delmedia]")) return;
    const g = S.gallery.find(x => x.id === id);
    return modal(g.file_type === "video" ? `<video class="lb" src="${esc(vopt(g.file_url))}" controls autoplay playsinline></video>` : `<img class="lb" src="${esc(opt(g.file_url,1600))}" alt="">`)
      .firstElementChild.style.cssText = "background:none;border:0;padding:0;width:auto";
  }
  if(act === "delmedia" || act === "delfriend"){
    e.stopPropagation();
    if(!confirm("Delete this permanently?")) return;
    const { error } = await sb.from(act === "delmedia" ? "gallery" : "friends").delete().eq("id", id);
    toast(error ? error.message : "Deleted");
  }
});

$("#auth").onclick = async () => { if(admin()){ await sb.auth.signOut(); toast("Logged out"); } else loginModal(); };
window.addEventListener("hashchange", () => { render(); scrollTo(0,0); });

/* ---------- Boot + real-time ---------- */
sb.auth.onAuthStateChange((_, session) => { S.user = session?.user || null; render(); });
(async () => {
  const { data } = await sb.auth.getSession(); S.user = data.session?.user || null;
  await load();
  sb.channel("selu-live").on("postgres_changes", { event:"*", schema:"public" }, load).subscribe();
})();
</script>
</body>
</html>
